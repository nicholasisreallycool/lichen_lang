[project]
name = "lichen"
version = "0.w.0"
description = "A tiny programming language"
requires-python = ">=3.9"

[project.scripts]
lichen = "lichen.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
